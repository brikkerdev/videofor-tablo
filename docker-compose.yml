services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      TZ: ${TZ:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tablo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tablo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Симулятор Видеофора для разработки: docker compose --profile sim up
  videofor-sim:
    build: .
    command: python -m simulator.videofor_sim
    environment:
      APP_URL: http://app:8000/api/events
      API_KEY: ${API_KEY:-}
    depends_on:
      app:
        condition: service_healthy
    profiles: [sim]
    restart: unless-stopped

volumes:
  pgdata:
